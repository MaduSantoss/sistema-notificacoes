services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy

  consumidor:
    build:
      context: .
      dockerfile: src/Consumidor/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: mailpit
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started